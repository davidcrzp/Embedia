services:
  db:
    image: postgres:16-alpine
    container_name: embedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: embedia
      POSTGRES_PASSWORD: embedia
      POSTGRES_DB: embedia
    ports: ["5432:5432"]
    volumes: ["embedia-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embedia -d embedia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  embedia-pgdata: {}
