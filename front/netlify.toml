[build]
  command = "bun run build:deploy"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.1"

[[redirects]]
  from = "/graphql"
  to = "https://embedia-production.up.railway.app/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://embedia-production.up.railway.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://embedia-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/upload/*"
  to = "https://embedia-production.up.railway.app/upload/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://embedia-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com; frame-src 'self' https://www.mercadopago.com; connect-src 'self' https:; worker-src 'self'; manifest-src 'self';"
